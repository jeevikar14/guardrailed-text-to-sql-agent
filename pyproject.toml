[project]
name = "text2sql-guardrails"
version = "0.1.0"
description = "Production-oriented Text-to-SQL agent with multi-layer deterministic guardrails"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: tests that take several seconds (e.g. real timeout enforcement) -- skip with `pytest -m \"not slow\"`",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data/chroma"]
